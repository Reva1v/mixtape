[package]
name = "mixtape-audio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Offline rendering hooks for the listening bench (tools/mixbench); the app does not use them.
bench = []

[dependencies]
symphonia = { version = "0.6.1", default-features = false, features = ["mkv", "isomp4", "aac", "ogg", "mp3"] }
symphonia-adapter-libopus = "0.3"
cpal = "0.18.2"
rtrb = "0.4"
rubato = "5.0"
ebur128 = "0.1.10"
thiserror.workspace = true
tracing.workspace = true
crossbeam-channel = "0.5"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
