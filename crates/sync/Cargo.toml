[package]
name = "mixtape-sync"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
mixtape-core.workspace = true
mixtape-library.workspace = true
mixtape-artwork.workspace = true
mixtape-yt.workspace = true
mixtape-audio.workspace = true
serde.workspace = true
serde_json.workspace = true
rusqlite.workspace = true
ts-rs.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "process"] }
tracing.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "stream"] }
url = "2.5"
md-5 = "0.10"
# Phone ↔ PC stats sync (`peer`): the frames are sealed with ChaCha20-Poly1305 under keys
# HKDF-SHA256 derives from the pairing key; mDNS finds the PC without system services.
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
hkdf = "0.12"
sha2 = "0.10"
getrandom = "0.3"
base64 = "0.22"
mdns-sd = { version = "0.21", default-features = false }

# Same major as Tauri 2 so only one copy of `windows` is compiled.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["net", "io-util", "test-util"] }

[lints]
workspace = true
