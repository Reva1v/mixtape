[workspace]
resolver = "3"
members = ["crates/*", "src-tauri", "tools/mixbench"]

[workspace.package]
version = "0.2.1"
edition = "2024"
rust-version = "1.89"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
mixtape-core = { path = "crates/core" }
mixtape-library = { path = "crates/library" }
mixtape-artwork = { path = "crates/artwork" }
mixtape-yt = { path = "crates/yt" }
mixtape-audio = { path = "crates/audio" }
mixtape-player = { path = "crates/player" }
mixtape-sync = { path = "crates/sync" }
mixtape-win = { path = "crates/win" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
tracing = "0.1"
ts-rs = { version = "12.0", features = ["no-serde-warnings"] }
rusqlite = { version = "0.40", features = ["bundled"] }
rusqlite_migration = "2.6"
unicode-normalization = "0.1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
fast_image_resize = { version = "6.1", features = ["image"] }
kmeans_colors = { version = "0.7", default-features = false, features = ["palette_color"] }
palette = "0.7"
dirs = "7.0"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
panic = "abort"
strip = true

# Listening bench (tools/mixbench): optimised, but quick to build.
[profile.mixbench]
inherits = "release"
lto = false
codegen-units = 16
incremental = true

[profile.dev.package."*"]
opt-level = 2
