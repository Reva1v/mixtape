[package]
name = "mixtape"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "mixtape_app"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }
serde_json.workspace = true

[dependencies]
mixtape-core.workspace = true
mixtape-library.workspace = true
mixtape-artwork.workspace = true
mixtape-player.workspace = true
mixtape-audio.workspace = true
mixtape-win.workspace = true
mixtape-yt.workspace = true
mixtape-sync.workspace = true
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-window-state = "2.5"
tauri-plugin-single-instance = "2.5"
tauri-plugin-updater = "2"
tauri-plugin-frame = "1.1.8"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "process"] }
tracing.workspace = true
ts-rs.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Stats sync with the phone (commands/peer.rs): the pairing QR code as SVG and this PC's
# addresses for it (the version mdns-sd already pulls in).
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
if-addrs = "0.15"

# The firewall rule for the phone sync is added through UAC (ShellExecuteExW "runas").
# Same major as Tauri 2 so only one copy of `windows` is compiled.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
