[package]
name = "mixtape"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "mixtape_app"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
mixtape-core.workspace = true
mixtape-library.workspace = true
mixtape-artwork.workspace = true
mixtape-player.workspace = true
mixtape-audio.workspace = true
mixtape-win.workspace = true
mixtape-yt.workspace = true
mixtape-sync.workspace = true
tauri = { version = "2.12", features = [] }
tauri-plugin-window-state = "2.5"
tauri-plugin-single-instance = "2.5"
tauri-plugin-updater = "2"
tauri-plugin-frame = "1.1.8"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
ts-rs.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lints]
workspace = true
