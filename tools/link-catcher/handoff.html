<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Mixtape</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Открыто в Mixtape</h1>
    <p class="link" id="link"></p>
    <p class="hint" id="hint" hidden>Отметьте «Всегда разрешать» в запросе браузера, чтобы он больше не спрашивал.</p>
    <div class="row">
      <button id="done" hidden>Браузер больше не спрашивает</button>
      <button id="browser" class="ghost">Открыть в браузере</button>
    </div>
  </main>
  <script src="handoff.js" type="module"></script>
</body>
</html>
